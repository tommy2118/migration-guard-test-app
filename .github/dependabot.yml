version: 2
updates:
  # Ruby dependencies
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 5
    reviewers:
      - "your-team/backend"
    labels:
      - "dependencies"
      - "ruby"
    groups:
      development-dependencies:
        patterns:
          - "rubocop*"
          - "rspec*"
          - "factory_bot*"
          - "faker"
    ignore:
      # Major version updates for critical gems
      - dependency-name: "rails"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pg"
        update-types: ["version-update:semver-major"]
  
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    reviewers:
      - "your-team/devops"
    labels:
      - "dependencies"
      - "github-actions"
  
  # Docker dependencies
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    reviewers:
      - "your-team/devops"
    labels:
      - "dependencies"
      - "docker"
  
  # Terraform providers
  - package-ecosystem: "terraform"
    directory: "/infra/terraform"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    reviewers:
      - "your-team/infrastructure"
    labels:
      - "dependencies"
      - "terraform"
