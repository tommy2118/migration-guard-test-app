name: Security Scan

on:
  schedule:
    - cron: '0 8 * * MON' # Weekly on Monday at 8 AM
  workflow_dispatch:

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby-3.4.1
          bundler-cache: true
      
      - name: Run Brakeman
        run: |
          bundle exec brakeman --no-pager --format json --output brakeman-report.json
        continue-on-error: true
      
      - name: Upload Brakeman report
        uses: actions/upload-artifact@v5
        with:
          name: brakeman-report
          path: brakeman-report.json
      
      - name: Run bundler-audit
        run: |
          bundle exec bundle-audit check --update
        continue-on-error: true
      
      - name: Run license_finder
        run: |
          bundle exec license_finder report --format json > licenses.json
        continue-on-error: true
      
      - name: Upload license report
        uses: actions/upload-artifact@v5
        with:
          name: license-report
          path: licenses.json
      
      - name: Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_REGISTRY }}/migration-guard-test-app:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Create security summary
        run: |
          echo "# Security Scan Summary" > security-summary.md
          echo "" >> security-summary.md
          echo "## Brakeman Results" >> security-summary.md
          if [[ -f brakeman-report.json ]]; then
            jq -r '.summary' brakeman-report.json >> security-summary.md
          fi
          echo "" >> security-summary.md
          echo "## Dependency Audit" >> security-summary.md
          bundle exec bundle-audit check >> security-summary.md || true
      
      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('security-summary.md', 'utf8');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: summary
            });
